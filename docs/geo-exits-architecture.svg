    <text x="1090" y="298" text-anchor="middle" font-size="9.5" fill="#57606a">WireGuard :51820</text>

    <rect x="1024" y="326" width="132" height="50" rx="8" fill="#3a5bcd" fill-opacity="0.10" stroke="#3a5bcd"/>
    <text x="1090" y="346" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">VPS · UK</text>
    <text x="1090" y="364" text-anchor="middle" font-size="9.5" fill="#57606a">WireGuard :51820</text>

    <rect x="1024" y="392" width="132" height="50" rx="8" fill="#1f8a70" fill-opacity="0.10" stroke="#1f8a70"/>
