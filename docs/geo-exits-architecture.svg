    <text x="1090" y="232" text-anchor="middle" font-size="9.5" fill="#57606a">WireGuard :51820</text>

    <rect x="1024" y="260" width="132" height="50" rx="8" fill="#e9a03b" fill-opacity="0.10" stroke="#e9a03b"/>
