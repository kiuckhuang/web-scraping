    <text x="316" y="430" font-size="10.5" fill="#57606a">Playwright ws :9222/browser</text>
  </g>

  <!-- ============ egress guards ============ -->
  <rect x="560" y="96" width="160" height="356" rx="10" fill="none" stroke="#d0d7de" stroke-dasharray="6 5"/>
  <text x="640" y="114" text-anchor="middle" font-size="10" letter-spacing="1" fill="#57606a">EGRESS GUARDS ×5</text>

  <g>
    <rect x="572" y="128" width="136" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="640" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">guard-ca :8081</text>
    <text x="640" y="166" text-anchor="middle" font-size="9.5" fill="#57606a">DNS-pinned egress</text>

    <rect x="572" y="194" width="136" height="50" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="640" y="214" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">guard-hk :8081</text>
    <text x="640" y="232" text-anchor="middle" font-size="9.5" fill="#57606a">DNS-pinned egress</text>

