  <rect x="0" y="0" width="1180" height="800" fill="#ffffff"/>

  <text x="590" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">Geo-exit scraping architecture — CA · HK · JP · UK · US</text>
  <text x="590" y="60" text-anchor="middle" font-size="12.5" fill="#57606a">One Camoufox container per exit · sing-box WireGuard fabric · egress-guard chain preserved · design doc — not implemented yet</text>

  <!-- ============ left column: clients / edge ============ -->
  <rect x="24" y="140" width="170" height="56" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="109" y="163" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">AI agents / apps</text>
  <text x="109" y="181" text-anchor="middle" font-size="10.5" fill="#57606a">MCP · REST callers</text>

  <rect x="24" y="236" width="170" height="52" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="109" y="258" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">ws-mcp</text>
  <text x="109" y="276" text-anchor="middle" font-size="10.5" fill="#57606a">:9100 · edge network</text>

  <rect x="24" y="328" width="170" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="109" y="350" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1f2328">ws-bridge — FastAPI</text>
  <text x="109" y="368" text-anchor="middle" font-size="10.5" fill="#57606a">:8000 · session→exit map</text>
  <text x="109" y="384" text-anchor="middle" font-size="10.5" fill="#57606a">per-exit TZ resolution</text>

  <rect x="24" y="640" width="170" height="64" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="5 4"/>
  <text x="109" y="662" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">ws-searxng (optional)</text>
  <text x="109" y="680" text-anchor="middle" font-size="10.5" fill="#57606a">profile: searxng</text>
  <text x="109" y="696" text-anchor="middle" font-size="10.5" fill="#57606a">per-engine geo networks</text>

  <line x1="109" y1="196" x2="109" y2="232" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="109" y1="288" x2="109" y2="324" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="109" y1="392" x2="109" y2="636" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="115" y="520" font-size="10" fill="#57606a">search chain</text>

