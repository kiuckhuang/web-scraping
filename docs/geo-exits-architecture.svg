  <text x="728" y="742" font-size="11" fill="#1f2328">WireGuard tunnel</text>

  <text x="24" y="772" font-size="10.5" fill="#57606a">Session pins the exit at creation (POST /sessions {name, exit}) — the proxy is chosen per container, never per scrape (preserves SSRF-guarded egress).</text>
  <text x="24" y="788" font-size="10.5" fill="#57606a">CA note: no Vancouver-BC VPS exists at major providers (nearest: AWS ca-west-1 Calgary) · verify each VPS IP reports the right GeoIP country before committing.</text>
