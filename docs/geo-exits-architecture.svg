  <line x1="360" y1="738" x2="400" y2="738" stroke="#57606a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="408" y="742" font-size="11" fill="#1f2328">page traffic</text>
  <line x1="510" y1="738" x2="550" y2="738" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
