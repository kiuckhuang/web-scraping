  <text x="237" y="314" text-anchor="middle" font-size="10" fill="#57606a">Playwright ws</text>

  <!-- ============ bottom flows ============ -->
  <polyline points="194,380 236,380 236,568 300,568" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
