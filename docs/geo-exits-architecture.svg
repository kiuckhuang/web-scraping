    <line x1="966" y1="285" x2="1020" y2="285" stroke="#e9a03b" marker-end="url(#a-jp)"/>
    <line x1="966" y1="351" x2="1020" y2="351" stroke="#3a5bcd" marker-end="url(#a-uk)"/>
    <line x1="966" y1="417" x2="1020" y2="417" stroke="#1f8a70" marker-end="url(#a-us)"/>
  </g>

