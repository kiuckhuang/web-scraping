    <text x="640" y="430" text-anchor="middle" font-size="9.5" fill="#57606a">DNS-pinned egress</text>
  </g>

  <!-- ============ exit router (sing-box) ============ -->
  <rect x="790" y="128" width="176" height="316" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="878" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">ws-exit-router</text>
