  <rect x="802" y="183" width="9" height="9" rx="2" fill="#e76f51"/>
  <text x="818" y="192" font-size="11" fill="#1f2328">:10801 → WG · CA</text>
  <rect x="802" y="209" width="9" height="9" rx="2" fill="#c1121f"/>
  <text x="818" y="218" font-size="11" fill="#1f2328">:10802 → WG · HK</text>
  <rect x="802" y="235" width="9" height="9" rx="2" fill="#e9a03b"/>
  <text x="818" y="244" font-size="11" fill="#1f2328">:10803 → WG · JP</text>
  <rect x="802" y="261" width="9" height="9" rx="2" fill="#3a5bcd"/>
  <text x="818" y="270" font-size="11" fill="#1f2328">:10804 → WG · UK</text>
  <rect x="802" y="287" width="9" height="9" rx="2" fill="#1f8a70"/>
  <text x="818" y="296" font-size="11" fill="#1f2328">:10805 → WG · US</text>

  <text x="802" y="330" font-size="9.5" fill="#57606a">ip_is_private → reject</text>
  <text x="802" y="346" font-size="9.5" fill="#57606a">fail-closed (no default out)</text>
  <text x="802" y="362" font-size="9.5" fill="#57606a">exit-side DNS per inbound</text>
  <text x="802" y="378" font-size="9.5" fill="#57606a">urltest health per exit</text>

  <!-- ============ VPS exits ============ -->
  <text x="995" y="118" text-anchor="middle" font-size="10" fill="#57606a">WireGuard tunnels</text>
  <g>
    <rect x="1024" y="128" width="132" height="50" rx="8" fill="#e76f51" fill-opacity="0.10" stroke="#e76f51"/>
