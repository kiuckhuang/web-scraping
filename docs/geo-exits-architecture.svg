  <polyline points="194,672 878,672 878,452" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="536" y="664" text-anchor="middle" font-size="10" fill="#57606a">socks5h :10801–10805 · per-engine geo networks</text>

  <!-- ============ legend ============ -->
