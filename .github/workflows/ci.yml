name: CI

on:
  push:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "opencode.jsonc.example"
  pull_request:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "opencode.jsonc.example"

# Cancel any in-progress CI run on the same branch when a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint with ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.7"
      - run: ruff check .

  test-bridge:
    name: Bridge unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e "bridge/.[dev]"
      - run: python -m pytest bridge/tests tests -q

  test-mcp:
    name: MCP unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r mcp/requirements.txt "pytest==9.1.1"
      - run: python -m pytest mcp/tests -q

  validate-containers:
    name: Validate Compose and images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f podman-compose.yml config --quiet
      - run: SEARXNG_ENABLED=true docker compose -f podman-compose.yml --profile searxng config --quiet
      - run: docker build --build-arg APP_UID=1000 --build-arg APP_GID=1000 -t web-scrape-bridge bridge
      - run: docker build --build-arg APP_UID=1000 --build-arg APP_GID=1000 -t web-scrape-mcp mcp
      - run: docker build --build-arg APP_UID=1000 --build-arg APP_GID=1000 -t web-scrape-camoufox camoufox
