name: CI

on:
  push:
  pull_request:

jobs:
  test-bridge:
    name: Bridge unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "bridge/.[dev]"
      - run: python -m pytest bridge/tests -q

  test-mcp:
    name: MCP unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r mcp/requirements.txt pytest
      - run: python -m pytest mcp/tests -q
