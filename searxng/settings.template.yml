# SearXNG configuration — JSON API enabled for the bridge service
# Docs: https://docs.searxng.org/admin/settings/settings.html
# This file is rendered at container start from environment overrides
# (see render_settings.py and searxng-entrypoint.sh).

use_default_settings:
  engines:
    keep_only:
      # Priority 1 + 2 general web engines, plus bing as a conditional
      # last resort: bing is registered but DISABLED by default, so it never
      # joins the normal merge — the bridge forces it via an "!bing" retry
      # only when the merge returns zero results (see SEARCH_FALLBACK_BING).
      # Its results quality is poor; "better than none" is the tradeoff.
      - google
      - duckduckgo
      - bing
      - duckduckgo news
      - wikipedia
      - github
      - stackoverflow
      - wikinews
      # NOTE: reddit is not kept — upstream's reddit engine definition in
      # this SearXNG channel fails to register ("The 'engine' field is
      # missing"), which only produces ERROR noise at startup.

general:
  instance_name: "Web Scrape Stack"
  debug: false
  enable_metrics: false

server:
  port: 8080
  bind_address: "0.0.0.0"
  base_url: "${SEARXNG_BASE_URL}"
  secret_key: "change-me-via-SEARXNG_SECRET_KEY-env"
  # This instance is private and only reachable by the internal bridge.
  limiter: false
  public_instance: false
  image_proxy: true

# Valkey (Redis-compatible) for rate limiting and caching
valkey:
  url: redis://valkey:6379/0

search:
  safe_search: 0
  default_lang: "en"
  autocomplete: "google"
  ban_time_on_fail: ${SEARXNG_BAN_TIME_ON_FAIL}
  max_ban_time_on_fail: ${SEARXNG_MAX_BAN_TIME_ON_FAIL}
  # How long an engine is suspended (in seconds) after it returns 429
  # "Too many requests". Tune via SEARXNG_SUSPEND_TOO_MANY.
  suspended_times:
    SearxEngineTooManyRequests: ${SEARXNG_SUSPEND_TOO_MANY}
  # CRITICAL: enable json format so the bridge can consume the API
  formats:
    - html
    - json
    - csv
    - rss

ui:
  default_theme: simple
  default_locale: ""
  query_in_title: false
  infinite_scroll: false

# Outgoing requests — optionally route through a proxy
outgoing:
  request_timeout: ${SEARXNG_REQUEST_TIMEOUT}
  max_request_timeout: ${SEARXNG_MAX_REQUEST_TIMEOUT}
${SEARXNG_OUTGOING_PROXY_BLOCK}

# Engines — enable useful ones, disable noisy ones. SearXNG queries every
# enabled engine of the requested category in PARALLEL and merges by score,
# so "priority" is expressed as (a) which engines exist at all and (b) the
# per-engine `weight` that scales each result's score in the merge.
engines:
  # Priority 1 — weight > 1 lets google results outrank equal-relevance
  # duckduckgo results in the merged ranking.
  - name: google
    disabled: false
    weight: 1.2
  # Priority 2 — default weight; still answers when google is CAPTCHA-walled
  - name: duckduckgo
    disabled: false
  # Last resort — disabled by default (never in the normal merge); the bridge
  # activates it per-query via "!bing" only when the merge returns zero rows.
  - name: bing
    disabled: true
  - name: duckduckgo news
    disabled: false
  - name: wikipedia
    disabled: false
  - name: github
    disabled: false
  - name: stackoverflow
    disabled: false
  - name: wikinews
    disabled: false
