# SearXNG configuration — JSON API enabled for the bridge service
# Docs: https://docs.searxng.org/admin/settings/settings.html

use_default_settings: true

general:
  instance_name: "Web Scrape Stack"
  debug: false
  enable_metrics: false

server:
  port: 8080
  bind_address: "0.0.0.0"
  base_url: "http://localhost:8888/"
  secret_key: "change-me-via-SEARXNG_SECRET_KEY-env"
  limiter: true
  public_instance: false
  image_proxy: true

# Redis (Valkey) for rate limiting and caching
redis:
  url: redis://valkey:6379/0

search:
  safe_search: 0
  default_lang: "en"
  autocomplete: "google"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  # CRITICAL: enable json format so the bridge can consume the API
  formats:
    - html
    - json
    - csv
    - rss

ui:
  default_theme: simple
  default_locale: ""
  query_in_title: false
  infinite_scroll: false

# Outgoing requests — optionally route through a proxy
outgoing:
  request_timeout: 10
  max_request_timeout: 15
  # Uncomment to route SearXNG engine requests through a proxy:
  # proxies:
  #   all://:
  #     - socks5h://proxy-host:1080

# Engines — enable useful ones, disable noisy ones
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: wikipedia
    disabled: false
  - name: github
    disabled: false
  - name: stackoverflow
    disabled: false
  - name: reddit
    disabled: false
  - name: duckduckgo_definitions
    disabled: false
  # Disable less useful defaults to reduce noise and rate-limit pressure
  - name: 1x
    disabled: true
  - name: apk_mirror
    disabled: true
  - name: google_images
    disabled: true
  - name: google_news
    disabled: true
  - name: google_videos
    disabled: true
  - name: media.ccc.de
    disabled: true
  - name: mixcloud
    disabled: true
  - name: rumble
    disabled: true
  - name: soundcloud
    disabled: true
  - name: twitcher
    disabled: true
