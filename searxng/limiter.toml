# SearXNG rate limiter configuration
# Docs: https://docs.searxng.org/admin/searx.limiter.html

[botdetection.ip_limit]
# Maximum requests per minute for a single IP
link_token = true

[botdetection.ip_lists]
# Block list (deny) and pass list (allow) of IPs.
# The limiter is disabled in settings.yml (internal JSON API only), but keep
# this list empty: a wildcard pass_ip would silently exempt every client if
# the limiter is ever enabled.
pass_ip = []
