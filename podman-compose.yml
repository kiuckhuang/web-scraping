# =============================================================================
#  Podman Compose stack: SearXNG (search) + Tilion Fortress (stealth scrape)
#  Usage:  podman compose up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  #  Valkey — Redis-compatible cache for SearXNG rate limiting & bot detection
  #  Network: internal only. No host ports.
  # ---------------------------------------------------------------------------
  valkey:
    image: docker.io/valkey/valkey:8-alpine
    container_name: ws-valkey
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 256
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - valkey-data:/data
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    networks:
      - internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  #  SearXNG — privacy metasearch engine (focused engine set, JSON API enabled)
  #  Bind: 127.0.0.1 only (core service, localhost access)
  #  Network: internal only
  # ---------------------------------------------------------------------------
  searxng:
    image: docker.io/searxng/searxng:${SEARXNG_CHANNEL:-2026.8.4-c63835bd2}
    container_name: ws-searxng
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 512
    ports:
      - "127.0.0.1:${PORT_SEARXNG:-8888}:8080"
    # settings.template.yml is rendered into settings.yml at startup from the
    # SEARXNG_* overrides below (see searxng-entrypoint.sh + render_settings.py).
    entrypoint: ["/bin/sh", "/usr/local/bin/ws-searxng-entrypoint.sh"]
    volumes:
      - ./searxng-entrypoint.sh:/usr/local/bin/ws-searxng-entrypoint.sh:ro
      - ./searxng/render_settings.py:/usr/local/bin/ws-render-settings.py:ro
      - ./searxng/settings.template.yml:/etc/searxng-templates/settings.template.yml:ro
      # Placeholder so the upstream entrypoint's existence check passes; the
      # real (rendered) settings are loaded via SEARXNG_SETTINGS_PATH=/tmp.
      - ./searxng/settings.template.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
      - searxng-data:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:${PORT_SEARXNG:-8888}/
       - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-}
      - FORCE_OWNERSHIP=${SEARXNG_FORCE_OWNERSHIP:-true}
      - UWSGI_THREADS=${SEARXNG_UWSGI_THREADS:-4}
      # Engine tuning — customizable via .env, with defaults if unset
      - SEARXNG_REQUEST_TIMEOUT=${SEARXNG_REQUEST_TIMEOUT:-10}
      - SEARXNG_MAX_REQUEST_TIMEOUT=${SEARXNG_MAX_REQUEST_TIMEOUT:-15}
      - SEARXNG_BAN_TIME_ON_FAIL=${SEARXNG_BAN_TIME_ON_FAIL:-5}
      - SEARXNG_MAX_BAN_TIME_ON_FAIL=${SEARXNG_MAX_BAN_TIME_ON_FAIL:-120}
      - SEARXNG_SUSPEND_TOO_MANY=${SEARXNG_SUSPEND_TOO_MANY:-180}
    depends_on:
      valkey:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  #  Tilion Fortress — stealth Chromium engine (CDP on :9222)
  #  The bridge connects to this for scraping bot-protected pages.
  #  Bind: 127.0.0.1 only (core service, localhost access)
  #  Network: internal only
  #  ~300 MB pull, ~850 MB on disk.
  # ---------------------------------------------------------------------------
  fortress:
    image: docker.io/tilion/fortress:${FORTRESS_CHANNEL:-latest}
    container_name: ws-fortress
    restart: unless-stopped
    mem_limit: 4g
    pids_limit: 1024
    shm_size: ${FORTRESS_SHM_SIZE:-2gb}
    ports:
      - "127.0.0.1:${PORT_FORTRESS:-9222}:9222"
    environment:
      # The wrapper applies FORTRESS_* overrides, otherwise these inherit host values.
      - TZ=${TZ:-UTC}
      - LANG=${LANG:-en_US.UTF-8}
      - FORTRESS_TZ=${FORTRESS_TZ:-}
      - FORTRESS_LANG=${FORTRESS_LANG:-}
      - UBLOCK_ORIGIN_LITE_ENABLED=${UBLOCK_ORIGIN_LITE_ENABLED:-true}
    depends_on:
      ublock-init:
        condition: service_healthy
    volumes:
      # Podman manages this persistent volume; :U remaps ownership for the
      # container user without exposing browser state through the host FS.
      # Mount both paths for compatibility with Fortress image variants.
      - fortress-profile:/tmp/tilion-profile:Z,U
      - fortress-profile:/tmp/tillion-profile:Z,U
      - ./scripts/init-ublock.sh:/usr/local/bin/ws-init-ublock.sh:ro,Z
      - ./fortress-entrypoint.sh:/usr/local/bin/ws-fortress-entrypoint.sh:ro,Z
    entrypoint: ["/bin/sh", "/usr/local/bin/ws-fortress-entrypoint.sh"]
    # The image's entrypoint already starts Chromium on :9223 (internal) and
    # socat-bridges 0.0.0.0:9222 -> 127.0.0.1:9223. Do NOT override command —
    # passing --remote-debugging-port=9222 causes a port conflict with socat.
    # Extra Chromium args can be passed via command: if needed (they append to
    # the entrypoint's defaults).
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-sf", "-H", "Host: 127.0.0.1", "http://127.0.0.1:9222/json/version"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  ublock-init:
    image: docker.io/library/alpine:3.22
    container_name: ws-ublock-init
    restart: unless-stopped
    environment:
      - UBLOCK_ORIGIN_LITE_ENABLED=${UBLOCK_ORIGIN_LITE_ENABLED:-true}
    volumes:
      # Use the same managed volume and ownership remap as Fortress; this init
      # container writes the extension before Fortress starts.
      - fortress-profile:/profile:Z,U
      - ./scripts/init-ublock.sh:/usr/local/bin/ws-init-ublock.sh:ro,Z
    entrypoint: ["/bin/sh", "/usr/local/bin/ws-init-ublock.sh"]
    networks:
      - internal
    healthcheck:
      test: ["CMD", "test", "-f", "/profile/.ublock-init-ready"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  # ---------------------------------------------------------------------------
  #  Bridge — orchestrates SearXNG search + Fortress scrape into a unified API
  #  Bind: 127.0.0.1 only (core service, localhost access)
  #  Networks: internal (talks to searxng/fortress) + edge (talks to mcp)
  #  REST:  http://localhost:8000  (FastAPI docs at /docs)
  # ---------------------------------------------------------------------------
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: ws-bridge
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${PORT_BRIDGE:-8000}:8000"
    environment:
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - FORTRESS_CDP_URL=${FORTRESS_CDP_URL:-http://fortress:9222}
      - BRIDGE_HOST=${BRIDGE_HOST:-0.0.0.0}
      - BRIDGE_PORT=${BRIDGE_PORT:-8000}
      # Scrape cache: repeated scrapes of the same URL within the TTL are
      # served from memory instead of re-navigating the browser.
      - BRIDGE_CACHE_TTL=${BRIDGE_CACHE_TTL:-300}
      - BRIDGE_CACHE_MAX=${BRIDGE_CACHE_MAX:-100}
      - BRIDGE_CACHE_MAX_BYTES=${BRIDGE_CACHE_MAX_BYTES:-26214400}
      # Post-navigation pause (ms) before extraction
      - FORTRESS_NAV_DELAY=${FORTRESS_NAV_DELAY:-400}
      - FORTRESS_TIMEOUT=${FORTRESS_TIMEOUT:-60}
      - FORTRESS_NAV_WAIT=${FORTRESS_NAV_WAIT:-domcontentloaded}
      - FORTRESS_MAX_CONCURRENT_PAGES=${FORTRESS_MAX_CONCURRENT_PAGES:-3}
      - FORTRESS_WAF_WAIT=${FORTRESS_WAF_WAIT:-15}
      - FORTRESS_ISOLATE_CONTEXTS=${FORTRESS_ISOLATE_CONTEXTS:-true}
    depends_on:
      searxng:
        condition: service_healthy
      fortress:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import json,urllib.request; data=json.load(urllib.request.urlopen(\"http://127.0.0.1:8000/health\")); raise SystemExit(0 if data.get(\"status\") == \"ok\" else 1)'" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal
      - edge

  # ---------------------------------------------------------------------------
  #  MCP Server — Streamable HTTP transport for AI agents (opencode, Claude, Cursor, etc.)
  #  Bind: localhost by default; set MCP_BIND_HOST for intentional remote exposure.
  #  Network: edge only (can reach bridge, but NOT searxng/fortress/valkey)
  #  Exposes: http://<host>:9100/mcp  (MCP Streamable HTTP)
  #  Calls the bridge REST API — no local Python needed.
  # ---------------------------------------------------------------------------
  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: ws-mcp
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    ports:
      - "${MCP_BIND_HOST:-127.0.0.1}:${PORT_MCP:-9100}:9100"
    environment:
      - BRIDGE_URL=${BRIDGE_URL:-http://bridge:8000}
      # The container listens on all interfaces; MCP_BIND_HOST controls the
      # host-side published address below. A non-local host requires a key.
      - MCP_LISTEN_HOST=0.0.0.0
      - MCP_PUBLIC_BIND_HOST=${MCP_BIND_HOST:-127.0.0.1}
      - MCP_PORT=9100
      - MCP_API_KEY=${MCP_API_KEY:-}
      # Security knobs
      - MCP_SESSION_TTL=${MCP_SESSION_TTL:-1800}
      - MCP_RATE_LIMIT=${MCP_RATE_LIMIT:-120}
      - MCP_MAX_BODY=${MCP_MAX_BODY:-1048576}
      - MCP_ALLOWED_ORIGIN=${MCP_ALLOWED_ORIGIN:-localhost}
      # Result token budgets (chars per item)
      - MCP_SNIPPET_CHARS=${MCP_SNIPPET_CHARS:-300}
      - MCP_CONTENT_CHARS=${MCP_CONTENT_CHARS:-5000}
      - MCP_COMBINED_CHARS=${MCP_COMBINED_CHARS:-1200}
    depends_on:
      bridge:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  valkey-data:
  searxng-data:
  fortress-profile:

networks:
  # Core services only — no direct access from MCP or the outside world
  internal:
    driver: bridge
  # Edge tier — bridge + mcp. MCP is reachable from other machines,
  # but can only talk to bridge (not searxng/fortress/valkey directly)
  edge:
    driver: bridge
