# =============================================================================
#  Podman Compose stack: SearXNG (search) + Camoufox (stealth scrape)
#  Usage:  podman compose up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  #  Valkey — Redis-compatible cache for SearXNG rate limiting & bot detection
  #  Network: internal only. No host ports.
  # ---------------------------------------------------------------------------
  valkey:
    # Pinned to 9.1.1: current stable major; includes the 2026 security fixes
    # (CVE-2025-67733, CVE-2026-21863/21864, CVE-2026-23479/23631/25243,
    # CVE-2026-56684/63639).
    image: docker.io/valkey/valkey:9.1.1-alpine
    container_name: ws-valkey
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 256
    # maxmemory below the container limit keeps heavy SearXNG caching from
    # OOM-killing valkey; allkeys-lru evicts oldest keys instead of failing.
    command: valkey-server --save 30 1 --loglevel warning --maxmemory 192mb --maxmemory-policy allkeys-lru
    volumes:
      - valkey-data:/data
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    networks:
      - internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  #  SearXNG — privacy metasearch engine (focused engine set, JSON API enabled)
  #  Bind: 127.0.0.1 only (core service, localhost access)
  #  Network: internal only
  # ---------------------------------------------------------------------------
  searxng:
    image: docker.io/searxng/searxng:${SEARXNG_CHANNEL:-2026.8.28-a30b2d474}
    container_name: ws-searxng
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 512
    ports:
      - "127.0.0.1:${PORT_SEARXNG:-8888}:8080"
    # settings.template.yml is rendered into settings.yml at startup from the
    # SEARXNG_* overrides below (see searxng-entrypoint.sh + render_settings.py).
    entrypoint: ["/bin/sh", "/usr/local/bin/ws-searxng-entrypoint.sh"]
    volumes:
      - ./searxng-entrypoint.sh:/usr/local/bin/ws-searxng-entrypoint.sh:ro
      - ./searxng/render_settings.py:/usr/local/bin/ws-render-settings.py:ro
      - ./searxng/settings.template.yml:/etc/searxng-templates/settings.template.yml:ro
      # Placeholder so the upstream entrypoint's existence check passes; the
      # real (rendered) settings are loaded via SEARXNG_SETTINGS_PATH=/tmp.
      - ./searxng/settings.template.yml:/etc/searxng/settings.yml:ro
      - ./searxng/limiter.toml:/etc/searxng/limiter.toml:ro
      - searxng-data:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:${PORT_SEARXNG:-8888}/
      - SEARXNG_SECRET_KEY=${SEARXNG_SECRET_KEY:-}
      - FORCE_OWNERSHIP=${SEARXNG_FORCE_OWNERSHIP:-true}
      - UWSGI_THREADS=${SEARXNG_UWSGI_THREADS:-4}
      # Engine tuning — customizable via .env, with defaults if unset
      - SEARXNG_REQUEST_TIMEOUT=${SEARXNG_REQUEST_TIMEOUT:-10}
      - SEARXNG_MAX_REQUEST_TIMEOUT=${SEARXNG_MAX_REQUEST_TIMEOUT:-15}
      - SEARXNG_BAN_TIME_ON_FAIL=${SEARXNG_BAN_TIME_ON_FAIL:-5}
      - SEARXNG_MAX_BAN_TIME_ON_FAIL=${SEARXNG_MAX_BAN_TIME_ON_FAIL:-120}
      - SEARXNG_SUSPEND_TOO_MANY=${SEARXNG_SUSPEND_TOO_MANY:-180}
      # Outbound proxy for engine requests (empty = direct egress); see .env
      - SEARXNG_OUTGOING_PROXY=${SEARXNG_OUTGOING_PROXY:-}
    depends_on:
      valkey:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  #  Camoufox — anti-detect Firefox fork (patched at the C++ level), served
  #  over Playwright's websocket protocol.
  #  Bind: 127.0.0.1 only (host, direct use) / internal network (bridge access).
  #  Profile: ephemeral by design (Playwright's launchServer cannot serve a
  #  persistent context over websocket) — see README "Named sessions".
  # ---------------------------------------------------------------------------
  camoufox:
    build:
      context: ./camoufox
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: localhost/ws-camoufox:${CAMOUFOX_IMAGE_TAG:-local}
    container_name: ws-camoufox
    restart: unless-stopped
    mem_limit: ${CAMOUFOX_MEM_LIMIT:-4g}
    pids_limit: ${CAMOUFOX_PIDS_LIMIT:-1024}
    shm_size: ${CAMOUFOX_SHM_SIZE:-4gb}
    ports:
      - "127.0.0.1:${PORT_CAMOUFOX:-9223}:9222"
    environment:
      - TZ=${TZ:-UTC}
      - CAMOUFOX_PORT=9222
      - CAMOUFOX_WS_PATH=${CAMOUFOX_WS_PATH:-browser}
      - CAMOUFOX_MAX_CONNECTIONS=${CAMOUFOX_MAX_CONNECTIONS:-8}
      # Outbound proxy for all browser traffic (see .env.example; empty = direct)
      - CAMOUFOX_PROXY_SERVER=${CAMOUFOX_PROXY_SERVER:-}
      - CAMOUFOX_PROXY_USERNAME=${CAMOUFOX_PROXY_USERNAME:-}
      - CAMOUFOX_PROXY_PASSWORD=${CAMOUFOX_PROXY_PASSWORD:-}
      - CAMOUFOX_PROXY_BYPASS=${CAMOUFOX_PROXY_BYPASS:-}
      # GeoIP-consistent fingerprints: auto = on whenever a proxy is set
      - CAMOUFOX_GEOIP=${CAMOUFOX_GEOIP:-auto}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 9222), timeout=3).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  #  Bridge — orchestrates SearXNG search + stealth scrape into a unified API
  #  Bind: 127.0.0.1 only (core service, localhost access)
  #  Networks: internal (talks to searxng/camoufox) + edge (talks to mcp)
  #  REST:  http://localhost:8000  (FastAPI docs at /docs)
  # ---------------------------------------------------------------------------
  bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: ws-bridge
    restart: unless-stopped
    mem_limit: 1g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${PORT_BRIDGE:-8000}:8000"
    environment:
      - SEARXNG_URL=${SEARXNG_URL:-http://searxng:8080}
      - BRIDGE_HOST=${BRIDGE_HOST:-0.0.0.0}
      - BRIDGE_PORT=${BRIDGE_PORT:-8000}
      # Scrape cache: repeated scrapes of the same URL within the TTL are
      # served from memory instead of re-navigating the browser.
      - BRIDGE_CACHE_TTL=${BRIDGE_CACHE_TTL:-300}
      - BRIDGE_CACHE_MAX=${BRIDGE_CACHE_MAX:-100}
      - BRIDGE_CACHE_MAX_BYTES=${BRIDGE_CACHE_MAX_BYTES:-26214400}
      # Search chain: SEARCH_PRIMARY picks the first transport ("searxng" or
      # "browser"); the other serves as fallback. Browser SERP engine order
      # via BROWSER_SEARCH_ENGINES; SEARCH_FALLBACK_BING inserts a forced
      # "!bing" stage (default off — bing result quality proved useless)
      - SEARCH_PRIMARY=${SEARCH_PRIMARY:-browser}
      - SEARCH_FALLBACK_BING=${SEARCH_FALLBACK_BING:-false}
      - SEARCH_FALLBACK_BROWSER=${SEARCH_FALLBACK_BROWSER:-true}
      - BROWSER_SEARCH_ENGINES=${BROWSER_SEARCH_ENGINES:-google,duckduckgo,duckduckgo lite}
      # Post-navigation pause (ms) before content extraction
      - CAMOUFOX_NAV_DELAY=${CAMOUFOX_NAV_DELAY:-400}
      - CAMOUFOX_TIMEOUT=${CAMOUFOX_TIMEOUT:-60}
      - CAMOUFOX_NAV_WAIT=${CAMOUFOX_NAV_WAIT:-domcontentloaded}
      - CAMOUFOX_MAX_CONCURRENT_PAGES=${CAMOUFOX_MAX_CONCURRENT_PAGES:-3}
      - CAMOUFOX_WAF_WAIT=${CAMOUFOX_WAF_WAIT:-15}
      - CAMOUFOX_ISOLATE_CONTEXTS=${CAMOUFOX_ISOLATE_CONTEXTS:-true}
      # Named sessions (login persistence): max concurrent session contexts
      - CAMOUFOX_MAX_SESSIONS=${CAMOUFOX_MAX_SESSIONS:-16}
      # Proxy (bridge-side copy): derives the egress timezone for context
      # creation so the fingerprint timezone matches the proxy exit
      - CAMOUFOX_PROXY_SERVER=${CAMOUFOX_PROXY_SERVER:-}
      - CAMOUFOX_PROXY_USERNAME=${CAMOUFOX_PROXY_USERNAME:-}
      - CAMOUFOX_PROXY_PASSWORD=${CAMOUFOX_PROXY_PASSWORD:-}
      - CAMOUFOX_TIMEZONE=${CAMOUFOX_TIMEZONE:-}
      # Wall-clock budget for a single /crawl call (s, 0 = unlimited)
      - CRAWL_MAX_SECONDS=${CRAWL_MAX_SECONDS:-1800}
      # TTL (s) for cached SSRF DNS verdicts (0 disables caching)
      - SSRF_DNS_CACHE_TTL=${SSRF_DNS_CACHE_TTL:-60}
      - CAMOUFOX_WS_URL=${CAMOUFOX_WS_URL:-ws://camoufox:9222/browser}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      searxng:
        condition: service_healthy
      camoufox:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import json,urllib.request; data=json.load(urllib.request.urlopen(\"http://127.0.0.1:8000/health\")); raise SystemExit(0 if data.get(\"status\") == \"ok\" else 1)'" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal
      - edge

  # ---------------------------------------------------------------------------
  #  MCP Server — Streamable HTTP transport for AI agents (opencode, Claude, Cursor, etc.)
  #  Bind: localhost by default; set MCP_BIND_HOST for intentional remote exposure.
  #  Network: edge only (can reach bridge, but NOT searxng/camoufox/valkey)
  #  Exposes: http://<host>:9100/mcp  (MCP Streamable HTTP)
  #  Calls the bridge REST API — no local Python needed.
  # ---------------------------------------------------------------------------
  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: ws-mcp
    restart: unless-stopped
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    ports:
      - "${MCP_BIND_HOST:-127.0.0.1}:${PORT_MCP:-9100}:9100"
    environment:
      - BRIDGE_URL=${BRIDGE_URL:-http://bridge:8000}
      # The container listens on all interfaces; MCP_BIND_HOST controls the
      # host-side published address below. A non-local host requires a key.
      - MCP_LISTEN_HOST=0.0.0.0
      - MCP_PUBLIC_BIND_HOST=${MCP_BIND_HOST:-127.0.0.1}
      - MCP_PORT=9100
      - MCP_API_KEY=${MCP_API_KEY:-}
      # Security knobs
      - MCP_SESSION_TTL=${MCP_SESSION_TTL:-1800}
      - MCP_RATE_LIMIT=${MCP_RATE_LIMIT:-120}
      - MCP_MAX_BODY=${MCP_MAX_BODY:-1048576}
      - MCP_ALLOWED_ORIGIN=${MCP_ALLOWED_ORIGIN:-localhost}
      # Trusted client CIDRs; empty = auto-detect (loopback + container /24)
      - MCP_TRUSTED_CIDRS=${MCP_TRUSTED_CIDRS:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Result token budgets (chars per item)
      - MCP_SNIPPET_CHARS=${MCP_SNIPPET_CHARS:-300}
      - MCP_CONTENT_CHARS=${MCP_CONTENT_CHARS:-5000}
      - MCP_COMBINED_CHARS=${MCP_COMBINED_CHARS:-1200}
    depends_on:
      bridge:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  valkey-data:
  searxng-data:

networks:
  # Core services only — no direct access from MCP or the outside world
  internal:
    driver: bridge
  # Edge tier — bridge + mcp. MCP is reachable from other machines,
  # but can only talk to bridge (not searxng/camoufox/valkey directly)
  edge:
    driver: bridge
