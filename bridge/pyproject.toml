[project]
name = "web-scrape-bridge"
version = "0.1.0"
description = "Bridge service: SearXNG search + Camoufox stealth scrape"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.141.1",
    # Pinned explicitly: fastapi only sets a lower bound (starlette>=0.46.0),
    # so without this the image silently pulls a Starlette that may predate the
    # 2026 security fixes (CVE-2026-48710 "BadHost", CVE-2026-48817/48818,
    # CVE-2026-54282/54283 — all fixed in 1.0.1..1.3.1).
    "starlette==1.6.0",
    "uvicorn[standard]==0.52.4",
    "httpx==0.28.1",
    # Pinned to the 1.60 line: Playwright's remote protocol enforces
    # client/server minor-version parity (the server answers HTTP 428 on
    # mismatch), and the camoufox image's driver is playwright 1.60.x
    # (camoufox 0.5.5 requires <1.61). When camoufox ships a release
    # supporting a newer playwright, bump both pins together.
    "playwright==1.60.0",
    "pydantic==2.13.5",
    "markdownify==1.2.3",
    # HTTP fast path: Chrome-shaped TLS (JA3/JA4) + HTTP/2 fingerprinting for
    # static pages, escalating to the stealth browser for JS/WAF targets.
    "curl_cffi==0.16.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]
