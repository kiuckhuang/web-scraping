[project]
name = "web-scrape-bridge"
version = "0.1.0"
description = "Bridge service: SearXNG search + Tilion Fortress stealth scrape"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.141.1",
    # Pinned explicitly: fastapi only sets a lower bound (starlette>=0.46.0),
    # so without this the image silently pulls a Starlette that may predate the
    # 2026 security fixes (CVE-2026-48710 "BadHost", CVE-2026-48817/48818,
    # CVE-2026-54282/54283 — all fixed in 1.0.1..1.3.1).
    "starlette==1.6.0",
    "uvicorn[standard]==0.52.4",
    "httpx==0.28.1",
    "playwright==1.62.0",
    "pydantic==2.13.5",
    "markdownify==1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]
