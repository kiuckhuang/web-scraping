[project]
name = "web-scrape-bridge"
version = "0.1.0"
description = "Bridge service: SearXNG search + Tilion Fortress stealth scrape"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "httpx==0.28.1",
    "playwright==1.62.0",
    "pydantic==2.13.4",
    "markdownify==1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bridge"]
