[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by developer discretion
]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pytest.ini_options]
# Suites run against the working tree (host venv / CI); tests are
# network-free and drive asyncio via explicit asyncio.run().
testpaths = ["bridge/tests", "mcp/tests"]
addopts = "-q"
